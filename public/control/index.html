<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Presenter Control</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Always-visible safety control: kills on-screen text from any tab -->
  <div id="topBar">
    <button id="hideBtn" title="Hide on-screen text immediately">HIDE / CLEAR</button>
    <div id="wsStatus" class="ws-status ws-disconnected">
      <span class="dot"></span><span class="label">connecting…</span>
    </div>
  </div>

  <div id="liveBanner" class="live-banner live-empty">Nothing showing</div>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="scripture">Scripture</button>
    <button class="tab-btn" data-tab="songs">Songs</button>
    <button class="tab-btn" data-tab="announcements">Announcements</button>
  </nav>

  <!-- ===================== SCRIPTURE ===================== -->
  <section id="tab-scripture" class="tab-panel active">
    <input id="scriptureSearch" type="text" placeholder="Reference or keywords… (e.g. jn 3:16)" autocomplete="off" />

    <div id="translationPicker" class="translation-picker"></div>

    <div class="bg-picker">
      <label for="scriptureBgSelect">Background</label>
      <select id="scriptureBgSelect"></select>
    </div>

    <div id="scriptureNav" class="nav-controls" hidden>
      <button id="prevVerseBtn">&#9664; Prev</button>
      <span id="currentVerseLabel" class="nav-label"></span>
      <button id="nextVerseBtn">Next &#9654;</button>
    </div>

    <div id="scriptureResults" class="results-list"></div>
  </section>

  <!-- ===================== SONGS ===================== -->
  <section id="tab-songs" class="tab-panel">
    <input id="songSearch" type="text" placeholder="Search songs by title…" autocomplete="off" />

    <div class="bg-picker">
      <label for="lyricBgSelect">Background</label>
      <select id="lyricBgSelect"></select>
    </div>

    <div id="songList" class="results-list"></div>

    <div id="songDetail" hidden>
      <div class="song-detail-header">
        <button id="backToSongsBtn" title="Back to song list">&#8592;</button>
        <h3 id="songDetailTitle"></h3>
      </div>
      <div id="slideNav" class="nav-controls">
        <button id="prevSlideBtn">&#9664; Prev</button>
        <span id="currentSlideLabel" class="nav-label"></span>
        <button id="nextSlideBtn">Next &#9654;</button>
      </div>
      <div id="slideList" class="results-list"></div>
    </div>
  </section>

  <!-- ===================== ANNOUNCEMENTS ===================== -->
  <section id="tab-announcements" class="tab-panel">
    <div class="bg-picker">
      <label for="announcementBgSelect">Background</label>
      <select id="announcementBgSelect"></select>
    </div>

    <div id="announcementList" class="results-list"></div>

    <details id="composeDetails">
      <summary>Compose on the fly</summary>
      <div class="compose-form">
        <input id="annTitle" type="text" placeholder="Title" />
        <textarea id="annBody" placeholder="Body" rows="3"></textarea>
        <div class="btn-row">
          <button id="annShowBtn" class="primary-btn">Show now</button>
          <button id="annSaveBtn">Save for reuse</button>
        </div>
        <div id="annSaveStatus" class="save-status"></div>
      </div>
    </details>
  </section>

  <script src="app.js"></script>
</body>
</html>
